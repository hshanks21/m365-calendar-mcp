name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - run: npm ci
      - name: Release guard regressions
        run: node --test scripts/release-guard.test.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke
      - name: Compiled tests
        run: node --test dist/test/*.test.js
      - name: Credential-free Docker build (no push)
        run: docker build --platform linux/amd64 -f deploy/Dockerfile -t calendar-mcp:ci .
